name: Build and test AudioALL
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  linux-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test shared codecs
        run: ./scripts/test.sh
      - name: Package Linux
        run: ./scripts/package-linux.sh
      - name: Install Android build SDK
        run: |
          sdk="$RUNNER_TEMP/audioall-sdk"
          mkdir -p "$sdk/cmdline-tools"
          curl -fL --retry 3 -o "$RUNNER_TEMP/android-commandline.zip" https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q "$RUNNER_TEMP/android-commandline.zip" -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses < <(yes) > "$RUNNER_TEMP/android-licenses.log"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
      - name: Build signed development APK
        run: ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AudioALL-linux-android
          path: |
            dist/AudioALL-linux-x86_64.tar.gz
            dist/AudioALL-android.apk
            dist/AudioALL.jar
            dist/run-windows.bat
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build native Windows launcher and runtime
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Package
      - uses: actions/upload-artifact@v4
        with:
          name: AudioALL-windows
          path: dist/AudioALL-windows-x86_64.zip
